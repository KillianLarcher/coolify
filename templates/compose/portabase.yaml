# documentation: https://portabase.io/docs/getting-started
# slogan: Portabase is an open-source tool for database backup and restore.
# category: devtools
# tags: backup,database,postgres,mysql,mariadb,sqlite,mongodb,redis,valkey
# logo: svgs/portabase.svg
# port: 80

services:
  portabase:
    image: 'portabase/portabase:latest'

    environment:
      # Optional: Set timezone
      - TZ=UTC

      # Mandatory
      - PROJECT_URL = ${PROJECT_URL}
      - PROJECT_SECRET = ${PROJECT_SECRET}

    volumes:
      - portabase-data:/data

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


